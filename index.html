<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Late Stage Merch</title>
    <!-- Updated: hero 55% width, 580px max, nudged down -->
    <!-- Preload splash images so they load in parallel and are ready for the sequence -->
    <link rel="preload" as="image" href="latestagelogo0.jpg">
    <link rel="preload" as="image" href="latestagelogo1.jpg">
    <link rel="preload" as="image" href="latestagelogo2.jpg">
    <link rel="preload" as="image" href="latestagelogo3.jpg">
    <link rel="preload" as="image" href="latestagelogo4.jpg">
    <style>
        body { 
            background-color: #000; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; /* This handles the vertical centering */
            height: 100vh; 
            width: 100vw;
            overflow: hidden; 
        }

        .container { 
            position: relative; 
            width: 55%; 
            max-width: 580px;
            aspect-ratio: 1 / 1; 
            
            /* Hero 15% larger; nudged down slightly */
            /* NUDGE: Positive = down, negative = up */
            transform: translateY(5px); 
        }

        img { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: auto;
            opacity: 0; 
            transition: opacity 1.2s ease-in-out; 
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Use smaller image files (same names) for faster loading -->
        <img src="latestagelogo0.jpg" id="img0" decoding="async" alt=""> 
        <img src="latestagelogo1.jpg" id="img1" decoding="async" alt=""> 
        <img src="latestagelogo2.jpg" id="img2" decoding="async" alt=""> 
        <img src="latestagelogo3.jpg" id="img3" decoding="async" alt=""> 
        <img src="latestagelogo4.jpg" id="img4" decoding="async" alt=""> 
    </div>

    <script>
        const store = "https://latestagemerch.printful.me/";
        const images = [
            document.getElementById('img0'),
            document.getElementById('img1'),
            document.getElementById('img2'),
            document.getElementById('img3'),
            document.getElementById('img4')
        ];
        
        let step = 0;

        function playSequence() {
            if (step < images.length) {
                images[step].style.opacity = "1";
                step++;
                setTimeout(playSequence, 1300); 
            } else {
                // Brief pause after final image, then redirect
                setTimeout(() => { 
                    window.location.href = store; 
                }, 1600);
            }
        }

        window.onload = () => setTimeout(playSequence, 300);
    </script>
</body>
</html>
