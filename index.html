<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Late Stage Merch</title>
    <link rel="preload" as="image" href="latestagelogo0.jpg">
    <style>
        body { 
            background-color: #000; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            height: 100vh; 
            width: 100vw;
            overflow: hidden; 
        }

        .container { 
            position: relative; 
            width: 52.5%; 
            max-width: 548px;
            aspect-ratio: 1 / 1; 
            transform: translateY(-18px); 
        }

        img { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: auto;
            opacity: 0; 
            transition: opacity 1.2s ease-in-out; 
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="latestagelogo0.jpg" id="img0" decoding="async" alt="">
    </div>

    <script>
        const store = "https://latestagemerch.printful.me/";
        const splashImg = document.getElementById('img0');

        window.onload = () => {
            setTimeout(() => {
                splashImg.style.opacity = "1";
                setTimeout(() => { window.location.href = store; }, 1600);
            }, 300);
        };
    </script>
</body>
</html>
